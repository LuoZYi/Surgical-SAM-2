  memory_controller_aggressive_similarity_threshold: 0.96
  memory_controller_aggressive_mask_change_threshold: 0.12
  memory_controller_aggressive_centroid_shift_threshold: 0.04
  memory_controller_aggressive_fill_ratio_threshold: 0.75
  memory_controller_aggressive_prune_delta: 1
